server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: skillswap-backend
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: true
  cache:
    type: simple
  mail:
    host: ${MAIL_HOST:smtp.sendgrid.net}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000} # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days
    cookie-domain: ${COOKIE_DOMAIN:}
    cookie-secure: ${COOKIE_SECURE:true}
    cookie-same-site: ${COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://skillswap.vercel.app}
  rate-limit:
    auth-capacity: ${RATE_LIMIT_AUTH_CAPACITY:20}
    auth-refill-tokens: ${RATE_LIMIT_AUTH_REFILL:20}
    auth-refill-period-seconds: 60
    api-capacity: ${RATE_LIMIT_API_CAPACITY:60}
    api-refill-tokens: ${RATE_LIMIT_API_REFILL:60}
    api-refill-period-seconds: 60

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui/index.html

management:
  health:
    mail:
      enabled: false
    defaults:
      enabled: true
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
