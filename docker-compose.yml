services:
  mongodb:
    image: mongo:7.0
    container_name: skillswap-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: skillswap
    volumes:
      - mongo-data:/data/db
    networks:
      - skillswap-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillswap-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      MONGODB_URI: mongodb://mongodb:27017/skillswap
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: Lax
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080
    networks:
      - skillswap-net
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skillswap-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_BACKEND_URL: http://backend:8080
      NEXT_PUBLIC_WS_URL: http://localhost:8080/ws
    networks:
      - skillswap-net
    depends_on:
      backend:
        condition: service_healthy

networks:
  skillswap-net:
    driver: bridge

volumes:
  mongo-data:
